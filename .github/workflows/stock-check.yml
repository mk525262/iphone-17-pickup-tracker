name: iPhone 17 Pickup Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-17-stock-check
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python packages
        run: pip install requests

      - name: Check Apple pickup stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK: "https://script.google.com/macros/s/AKfycbzdBjbL3JE9oSapVy1N0bD7Wcc-52EdGFma8vkExnBZ1uae-IxKBOrRgFfe58Kk_NY/exec"
        run: |
          python <<'PY'
          import requests
          import json
          import os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          PARTS = {
              "Black": "MG6J4HN/A",
              "White": "MG6K4HN/A",
              "Mist Blue": "MG6L4HN/A",
              "Lavender": "MG6M4HN/A",
              "Sage": "MG6N4HN/A",
          }

          # Every current official Apple Retail Store in India, using that store's own address PIN.
          STORES = {
              "Apple BKC": "400051",
              "Apple Borivali": "400066",
              "Apple Hebbal": "560092",
              "Apple Koregaon Park": "411001",
              "Apple Noida": "201301",
              "Apple Saket": "110017",
          }

          API = "https://www.apple.com/in/shop/retail/pickup-message"
          STATE_FILE = Path("state.json")
          SHEET_WEBHOOK = os.environ["GOOGLE_SHEET_WEBHOOK"]
          IST = ZoneInfo("Asia/Kolkata")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Referer": "https://www.apple.com/in/shop/buy-iphone/iphone-17",
          }

          def check_store(store_name, pin):
              params = {"pl": "true", "searchNearby": "true", "location": pin, "mts.0": "regular"}
              for i, part in enumerate(PARTS.values()):
                  params[f"parts.{i}"] = part
              r = requests.get(API, params=params, headers=headers, timeout=20)
              r.raise_for_status()
              data = r.json()
              stores = data.get("body", {}).get("stores", [])
              target = None
              for s in stores:
                  name = (s.get("storeName") or "").lower()
                  if store_name.lower().replace("apple ", "") in name or store_name.lower() in name:
                      target = s
                      break
              if not target:
                  print(f"{store_name}: store not found in Apple response")
                  return [], False
              found = []
              for colour, part in PARTS.items():
                  status = target.get("partsAvailability", {}).get(part, {}).get("pickupDisplay")
                  print(f"{store_name} | {colour} | {status}")
                  if status in ("available", "unavailable"):
                      found.append({"store": store_name, "colour": colour, "storage": "256GB", "status": status})
                  else:
                      raise RuntimeError(f"Unexpected pickup status for {store_name} / {colour}: {status}")
              return found, True

          results, available = [], []
          successful_checks = 0
          for store, pin in STORES.items():
              try:
                  items, ok = check_store(store, pin)
                  if ok:
                      successful_checks += 1
                      results.extend(items)
                      available.extend([x for x in items if x["status"] == "available"])
              except Exception as e:
                  print(f"{store}: ERROR: {e}")

          if successful_checks != len(STORES):
              print("CHECK INCOMPLETE - state will NOT be reset and no daily Telegram report will be sent.")
              raise SystemExit(1)

          previous = {"any_available": False}
          if STATE_FILE.exists():
              try:
                  previous = json.loads(STATE_FILE.read_text())
              except Exception:
                  pass

          now_available = bool(available)
          stock_returned = now_available and not previous.get("any_available", False)
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          telegram_url = f"https://api.telegram.org/bot{token}/sendMessage"
          telegram_payload_base = {"chat_id": chat_id, "disable_web_page_preview": True}
          alert_count = 0

          if stock_returned:
              message = "🚨 iPhone 17 PICKUP AVAILABLE 🚨\n\n"
              for store in STORES:
                  store_items = [x for x in available if x["store"] == store]
                  if not store_items:
                      continue
                  message += f"📍 {store}\n"
                  for item in store_items:
                      message += f"🎨 {item['colour']} | 💾 {item['storage']}\n"
                  message += "\n"
              message += "🔗 https://www.apple.com/in/shop/buy-iphone/iphone-17\n\n⚡ Apple Store pickup stock detected."
              for n in range(1, 51):
                  payload = dict(telegram_payload_base)
                  payload["text"] = message
                  resp = requests.post(telegram_url, json=payload, timeout=20)
                  print("Telegram stock alert:", resp.status_code, "alert", n)
                  if resp.status_code == 200:
                      alert_count = n
                  elif resp.status_code == 429:
                      print("Telegram rate limit reached; stopping burst.")
                      break
                  else:
                      print("Telegram error:", resp.text[:500])
                      break

          now_ist = datetime.now(IST)
          daily_report = (now_ist.hour, now_ist.minute) in {(9, 0), (13, 0), (17, 0), (21, 0)}
          if daily_report:
              if now_available:
                  lines = ["🟢 AVAILABLE"]
                  for store in STORES:
                      store_items = [x for x in available if x["store"] == store]
                      for item in store_items:
                          lines.append(f"📍 {store} | 🎨 {item['colour']} | 💾 {item['storage']}")
              else:
                  lines = ["🔴 UNAVAILABLE", "All watched iPhone 17 256GB variants are currently unavailable at all 6 Apple Retail Stores in India."]
              daily_message = "📊 iPhone 17 Pickup Status\n\n" + "\n".join(lines) + f"\n\n🕐 {now_ist.strftime('%Y-%m-%d %H:%M:%S')} IST"
              payload = dict(telegram_payload_base)
              payload["text"] = daily_message
              resp = requests.post(telegram_url, json=payload, timeout=20)
              print("Telegram daily status:", resp.status_code, now_ist.strftime('%H:%M IST'))
              if resp.status_code != 200:
                  print("Telegram daily status error:", resp.text[:500])

          timestamp = now_ist.strftime("%Y-%m-%d %H:%M:%S")
          event = "STOCK_RETURNED" if stock_returned else "CHECK"
          for item in results:
              payload = {
                  "timestamp": timestamp,
                  "store": item["store"],
                  "colour": item["colour"],
                  "storage": item["storage"],
                  "pickup_status": item["status"],
                  "event": event,
                  "alert_number": alert_count if stock_returned and item["status"] == "available" else "",
              }
              try:
                  sheet_resp = requests.post(SHEET_WEBHOOK, json=payload, timeout=20)
                  print("Google Sheet:", sheet_resp.status_code, item["store"], item["colour"])
                  if sheet_resp.status_code >= 400:
                      print("Google Sheet error:", sheet_resp.text[:500])
              except Exception as e:
                  print("Google Sheet logging error:", e)

          STATE_FILE.write_text(json.dumps({"any_available": now_available, "available": available}, indent=2))
          PY

      - name: Save state
        run: |
          if git diff --quiet state.json; then
            echo "State unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock monitor state"
            git push
          fi
